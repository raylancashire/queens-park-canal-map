<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Queen's Park Canal Water Quality Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { margin:0; padding:0; font-family:Arial, Helvetica, sans-serif; background:#f5f7f5; color:#203126; }
    .page { max-width:1200px; margin:0 auto; background:white; }
    header { padding:18px 18px 12px; }
    h1 { margin:0 0 6px; font-size:24px; }
    header p { margin:0; color:#607066; line-height:1.4; }
    .toolbar { padding:10px 18px 14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .toolbar label { font-weight:700; font-size:14px; }
    .toolbar select { padding:8px 10px; border:1px solid #cbd4cd; border-radius:6px; background:white; min-width:250px; }
    #status { color:#607066; font-size:13px; }
    #error { display:none; margin:0 18px 12px; padding:10px 12px; background:#fff0f0; color:#8b1d1d; border:1px solid #efcaca; border-radius:6px; }
    #map { width:100%; height:610px; }
    .summary { display:flex; gap:10px; flex-wrap:wrap; padding:14px 18px 18px; border-top:1px solid #e3e9e4; }
    .card { min-width:145px; padding:10px 12px; border:1px solid #dfe6e1; border-radius:8px; background:#fff; }
    .card strong { display:block; font-size:20px; }
    .card span { color:#69776e; font-size:12px; }
    .leaflet-popup-content { margin:12px 14px; min-width:290px; }
    .popup-title { font-size:17px; font-weight:700; margin-bottom:3px; }
    .popup-date { color:#68766d; font-size:12px; margin-bottom:9px; }
    .assessment { display:inline-block; border-radius:12px; padding:3px 8px; font-weight:700; font-size:11px; margin-bottom:8px; }
    .results { width:100%; border-collapse:collapse; font-size:13px; }
    .results td { padding:5px 3px; border-bottom:1px solid #edf1ee; vertical-align:top; }
    .results td:first-child { font-weight:700; width:42%; }
    .history-wrap { margin-top:12px; max-height:220px; overflow:auto; }
    .history-title { font-weight:700; font-size:12px; margin-bottom:5px; }
    .history { width:100%; border-collapse:collapse; font-size:11px; }
    .history th, .history td { text-align:left; padding:5px 4px; border-bottom:1px solid #e9eeea; }
    .history th { position:sticky; top:0; background:#fff; }
    .note { margin-top:9px; font-size:12px; line-height:1.35; }
    .legend { background:#fff; padding:9px 11px; border-radius:6px; box-shadow:0 1px 5px rgba(0,0,0,.25); line-height:20px; font-size:12px; }
    .dot { display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:6px; border:1px solid #333; vertical-align:-1px; }
    @media (max-width:650px) {
      h1 { font-size:20px; }
      #map { height:520px; }
      .toolbar select { width:100%; min-width:0; }
      .leaflet-popup-content { min-width:240px; max-width:260px; }
    }
  </style>
</head>
<body>
<div class="page">
  <header>
    <h1>Queen's Park Canal Water Quality</h1>
    <p>FreshWater Watch citizen-science results for canal sampling sites around Queen's Park.</p>
  </header>

  <div class="toolbar">
    <label for="siteFilter">Sampling site:</label>
    <select id="siteFilter"><option value="all">All sites</option></select>
    <span id="status">Loading freshwater.csv…</span>
  </div>

  <div id="error"></div>
  <div id="map"></div>

  <div class="summary">
    <div class="card"><strong id="siteCount">0</strong><span>sampling sites</span></div>
    <div class="card"><strong id="sampleCount">0</strong><span>sample records</span></div>
    <div class="card"><strong id="latestDate">—</strong><span>latest sample</span></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const RELATIVE_CSV = "freshwater.csv";
const RAW_CSV = "https://raw.githubusercontent.com/RayLancashire/queens-park-canal-map/main/freshwater.csv";

const map = L.map("map").setView([51.525, -0.2085], 14);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: "&copy; OpenStreetMap contributors"
}).addTo(map);

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>\"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '\"':"&quot;", "'":"&#039;"
  })[ch]);
}

function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (ch === '"') inQuotes = false;
      else field += ch;
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === ',') { row.push(field); field = ""; }
      else if (ch === '\n') {
        row.push(field.replace(/\r$/, "")); field = "";
        if (row.some(v => v !== "")) rows.push(row);
        row = [];
      } else field += ch;
    }
  }
  row.push(field.replace(/\r$/, ""));
  if (row.some(v => v !== "")) rows.push(row);
  if (!rows.length) return [];

  const headers = rows[0].map(h => h.trim().replace(/^\uFEFF/, ""));
  return rows.slice(1).map(values => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = (values[i] ?? "").trim());
    return obj;
  });
}

function val(row, key) {
  const v = row[key];
  if (v == null) return "";
  const s = String(v).trim();
  return (s.toLowerCase() === "nan" || s.toLowerCase() === "null") ? "" : s;
}

function parseFreshwaterDate(text) {
  if (!text) return new Date(0);
  const m = text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return new Date(Number(m[3]), Number(m[1]) - 1, Number(m[2]));
  const d = new Date(text);
  return isNaN(d) ? new Date(0) : d;
}

function formatDate(text) {
  const d = parseFreshwaterDate(text);
  if (!d.getTime()) return text || "Date not recorded";
  return d.toLocaleDateString("en-GB", { day:"numeric", month:"short", year:"numeric" });
}

function assessment(row) {
  const t = (val(row, "feedback_eng") || val(row, "feedback_core")).toLowerCase();
  if (t.includes("very good") || t.includes("excellent")) return {label:"Very good", colour:"#006400"};
  if (t.includes("good ecological")) return {label:"Good", colour:"#00a86b"};
  if (t.includes("moderate")) return {label:"Moderate", colour:"#ffd966"};
  if (t.includes("poor")) return {label:"Poor", colour:"#f4b183"};
  return {label:"Assessment not available", colour:"#999999"};
}

function markerIcon(row) {
  const a = assessment(row);
  return L.divIcon({
    className: "",
    html: `<div style="width:20px;height:20px;border-radius:50%;background:${a.colour};border:2px solid #2d3a31;box-shadow:0 1px 3px rgba(0,0,0,.35)"></div>`,
    iconSize: [24,24], iconAnchor: [12,12], popupAnchor: [0,-10]
  });
}

function popupHTML(records) {
  const latest = records[0];
  const a = assessment(latest);
  const nitrate = val(latest, "Nitrate (mg/L)") || "—";
  const phosphate = val(latest, "Phosphate (mg/L)") || "—";
  const nitrateMid = val(latest, "nitrate_mid");
  const phosphateMid = val(latest, "phosphate_mid");
  const turbidity = val(latest, "Water quality - Secchi Tube (Turbidity)");
  const colour = val(latest, "Estimate the water colour");
  const notes = val(latest, "Notes (e.g. please list any aquatic mammals observed)");

  const history = records.map(r => `
    <tr>
      <td>${escapeHTML(formatDate(val(r, "Sample Date")))}</td>
      <td>${escapeHTML(val(r, "Nitrate (mg/L)") || "—")}</td>
      <td>${escapeHTML(val(r, "Phosphate (mg/L)") || "—")}</td>
    </tr>`).join("");

  return `
    <div class="popup-title">${escapeHTML(val(latest, "Site Name") || "Sampling site")}</div>
    <div class="popup-date">Latest sample: ${escapeHTML(formatDate(val(latest, "Sample Date")))}${val(latest, "Sample Time") ? " at " + escapeHTML(val(latest, "Sample Time")) : ""}</div>
    <span class="assessment" style="background:${a.colour};${a.colour === '#ffd966' || a.colour === '#f4b183' ? 'color:#222' : 'color:#fff'}">${escapeHTML(a.label)}</span>
    <table class="results">
      <tr><td>Nitrate</td><td><strong>${escapeHTML(nitrate)} mg/L</strong>${nitrateMid ? `<br><small>midpoint ${escapeHTML(nitrateMid)}</small>` : ""}</td></tr>
      <tr><td>Phosphate</td><td><strong>${escapeHTML(phosphate)} mg/L</strong>${phosphateMid ? `<br><small>midpoint ${escapeHTML(phosphateMid)}</small>` : ""}</td></tr>
      ${turbidity ? `<tr><td>Turbidity</td><td>${escapeHTML(turbidity)}</td></tr>` : ""}
      ${colour ? `<tr><td>Water colour</td><td>${escapeHTML(colour)}</td></tr>` : ""}
    </table>
    ${notes ? `<div class="note"><strong>Notes:</strong> ${escapeHTML(notes)}</div>` : ""}
    <div class="history-wrap">
      <div class="history-title">Results over time (${records.length} sample${records.length === 1 ? "" : "s"})</div>
      <table class="history">
        <thead><tr><th>Date</th><th>Nitrate</th><th>Phosphate</th></tr></thead>
        <tbody>${history}</tbody>
      </table>
    </div>`;
}

async function fetchCSV() {
  const urls = [RELATIVE_CSV, RAW_CSV];
  let lastError;
  for (const url of urls) {
    try {
      const response = await fetch(url, { cache:"no-store" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return await response.text();
    } catch (e) { lastError = e; }
  }
  throw lastError || new Error("CSV could not be loaded");
}

async function loadMapData() {
  try {
    const text = await fetchCSV();
    const data = parseCSV(text);
    if (!data.length) throw new Error("The CSV contains no data rows.");

    const grouped = {};
    for (const row of data) {
      const site = val(row, "Site Name");
      const lat = parseFloat(val(row, "y"));
      const lon = parseFloat(val(row, "x"));
      if (!site || !Number.isFinite(lat) || !Number.isFinite(lon)) continue;
      if (!grouped[site]) grouped[site] = [];
      grouped[site].push(row);
    }

    Object.values(grouped).forEach(records => {
      records.sort((a,b) => parseFreshwaterDate(val(b, "Sample Date")) - parseFreshwaterDate(val(a, "Sample Date")));
    });

    const siteFilter = document.getElementById("siteFilter");
    const markers = [];
    const bounds = [];

    Object.keys(grouped).sort().forEach(site => {
      const records = grouped[site];
      const latest = records[0];

      // Use the mean coordinates for all records at the same named site.
      const coords = records.map(r => [parseFloat(val(r,"y")), parseFloat(val(r,"x"))])
                            .filter(p => Number.isFinite(p[0]) && Number.isFinite(p[1]));
      const lat = coords.reduce((s,p) => s + p[0], 0) / coords.length;
      const lon = coords.reduce((s,p) => s + p[1], 0) / coords.length;

      const marker = L.marker([lat, lon], { icon: markerIcon(latest), title: site })
        .bindPopup(popupHTML(records), { maxWidth: 420 })
        .addTo(map);
      marker.siteName = site;
      markers.push(marker);
      bounds.push([lat, lon]);

      const option = document.createElement("option");
      option.value = site;
      option.textContent = `${site} (${records.length})`;
      siteFilter.appendChild(option);
    });

    if (bounds.length) map.fitBounds(bounds, { padding:[30,30], maxZoom:15 });

    siteFilter.addEventListener("change", () => {
      const chosen = siteFilter.value;
      markers.forEach(marker => {
        if (chosen === "all" || marker.siteName === chosen) {
          if (!map.hasLayer(marker)) marker.addTo(map);
        } else if (map.hasLayer(marker)) {
          map.removeLayer(marker);
        }
      });

      if (chosen === "all") {
        if (bounds.length) map.fitBounds(bounds, { padding:[30,30], maxZoom:15 });
      } else {
        const marker = markers.find(m => m.siteName === chosen);
        if (marker) {
          map.setView(marker.getLatLng(), 16);
          marker.openPopup();
        }
      }
    });

    document.getElementById("siteCount").textContent = Object.keys(grouped).length;
    document.getElementById("sampleCount").textContent = data.length;
    const allDates = data.map(r => parseFreshwaterDate(val(r,"Sample Date"))).filter(d => d.getTime());
    allDates.sort((a,b) => b-a);
    document.getElementById("latestDate").textContent = allDates.length ? allDates[0].toLocaleDateString("en-GB") : "—";
    document.getElementById("status").textContent = `${data.length} records loaded across ${Object.keys(grouped).length} sites`;
  } catch (err) {
    console.error(err);
    document.getElementById("status").textContent = "Data loading error";
    const box = document.getElementById("error");
    box.style.display = "block";
    box.textContent = "Could not load the FreshWater Watch CSV. Check that freshwater.csv is in the same GitHub repository as index.html. Details: " + err.message;
  }
}

const legend = L.control({ position:"bottomright" });
legend.onAdd = function() {
  const div = L.DomUtil.create("div", "legend");
  div.innerHTML = `
    <strong>Ecological status</strong><br>
    <span class="dot" style="background:#006400"></span>Very good<br>
    <span class="dot" style="background:#00a86b"></span>Good<br>
    <span class="dot" style="background:#ffd966"></span>Moderate<br>
    <span class="dot" style="background:#f4b183"></span>Poor`;
  return div;
};
legend.addTo(map);

loadMapData();
</script>
</body>
</html>
